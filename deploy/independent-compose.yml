# Independent upstream-only deployment — single gateway, no Python helper.
#
# Target: panda host :8014 — does NOT touch production :8012.
#
# Prep:
#   bash scripts/panda_sync_gptimage_db.sh
#   bash scripts/panda_deploy_independent.sh
#
# Rollback:
#   docker compose -f deploy/independent-compose.yml down

services:
  gateway:
    image: ghcr.io/croppedtravelleralex/gptimage-gateway-rs:latest
    network_mode: host
    env_file:
      - /root/gptimage-gateway-rs/secrets/gateway.env
    volumes:
      - /root/gptimage-gateway-rs/secrets/pin_account.json:/secrets/pin_account.json:ro
      - /root/gptimage-gateway-rs/secrets/accounts_pool.json:/secrets/accounts_pool.json:ro
      - /root/gptimage-gateway-rs/data:/data
    restart: unless-stopped
